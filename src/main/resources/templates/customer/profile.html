<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cá nhân - Clothing Store</title>
    <!-- Nhúng thuần Bootstrap 5 & Bootstrap Icons qua CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bag-heart-fill me-2"></i>CLOTHING STORE
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Trang chủ</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" th:href="@{/admin/users}">
                        <i class="bi bi-shield-lock me-1"></i>Quản trị Shop
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${user.fullName}">Nguyễn Văn A</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Main Container -->
<div class="container py-5">
    <div class="row g-4">
        <!-- Cột trái: Tóm tắt thông tin tài khoản (FR03) -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                <div class="mb-3">
                    <div class="bg-secondary bg-opacity-10 text-dark rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                        <i class="bi bi-person-fill fs-1"></i>
                    </div>
                </div>
                <h5 class="fw-bold mb-1" th:text="${user.fullName}">Nguyễn Văn A</h5>
                <p class="text-secondary small mb-3" th:text="${user.email}">user@example.com</p>

                <div class="d-flex justify-content-center gap-2 mb-3">
                    <span class="badge bg-primary" th:text="${user.role}">CUSTOMER</span>
                    <span class="badge bg-success" th:text="${user.status}">ACTIVE</span>
                </div>

                <hr class="text-secondary opacity-25">

                <ul class="list-unstyled text-start small text-secondary mb-0">
                    <li class="mb-2">
                        <i class="bi bi-telephone me-2 text-dark"></i>
                        <span th:text="${user.phone != null && !user.phone.isEmpty() ? user.phone : 'Chưa cập nhật SĐT'}">0912345678</span>
                    </li>
                    <li class="mb-2">
                        <i class="bi bi-geo-alt me-2 text-dark"></i>
                        <span th:text="${user.address != null && !user.address.isEmpty() ? user.address : 'Chưa cập nhật địa chỉ'}">Địa chỉ</span>
                    </li>
                    <li>
                        <i class="bi bi-calendar-check me-2 text-dark"></i>
                        Tham gia: <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Cột phải: Form cập nhật thông tin & Form đổi mật khẩu (FR04) -->
        <div class="col-lg-8">
            <!-- Tab chuyển đổi -->
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
                <ul class="nav nav-pills mb-4" id="profileTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-semibold" id="info-tab" data-bs-toggle="pill" data-bs-target="#info-pane" type="button" role="tab">
                            <i class="bi bi-pencil-square me-1"></i>Cập nhật thông tin
                        </button>
                    </li>
                    <li class="nav-item ms-2" role="presentation">
                        <button class="nav-link fw-semibold" id="pwd-tab" data-bs-toggle="pill" data-bs-target="#pwd-pane" type="button" role="tab">
                            <i class="bi bi-shield-lock me-1"></i>Đổi mật khẩu
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="profileTabContent">
                    <!-- Tab 1: Cập nhật thông tin liên hệ và địa chỉ giao hàng -->
                    <div class="tab-pane fade show active" id="info-pane" role="tabpanel">
                        <!-- Alert thông báo -->
                        <div class="alert alert-success alert-dismissible fade show small" role="alert" th:if="${successMessage}">
                            <i class="bi bi-check-circle-fill me-1"></i>
                            <span th:text="${successMessage}">Thành công</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div class="alert alert-danger alert-dismissible fade show small" role="alert" th:if="${errorMessage}">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span th:text="${errorMessage}">Lỗi</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/profile/update}" th:object="${profileDto}" method="post">
                            <div class="mb-3">
                                <label for="profileFullName" class="form-label small fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="profileFullName" th:field="*{fullName}" 
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="profilePhone" class="form-label small fw-semibold">Số điện thoại nhận hàng <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="profilePhone" th:field="*{phone}" 
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" 
                                       placeholder="Đúng 10 chữ số (Ví dụ: 0912345678)" required>
                                <div class="invalid-feedback small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="profileAddress" class="form-label small fw-semibold">Địa chỉ nhận hàng mặc định <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="profileAddress" rows="3" th:field="*{address}" 
                                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''" 
                                          placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
                                <div class="invalid-feedback small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <button type="submit" class="btn btn-dark fw-semibold px-4">
                                <i class="bi bi-save me-1"></i>Lưu thay đổi
                            </button>
                        </form>
                    </div>

                    <!-- Tab 2: Đổi mật khẩu -->
                    <div class="tab-pane fade" id="pwd-pane" role="tabpanel">
                        <!-- Alert thông báo đổi mật khẩu -->
                        <div class="alert alert-success alert-dismissible fade show small" role="alert" th:if="${passwordSuccessMessage}">
                            <i class="bi bi-check-circle-fill me-1"></i>
                            <span th:text="${passwordSuccessMessage}">Thành công</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div class="alert alert-danger alert-dismissible fade show small" role="alert" th:if="${passwordErrorMessage}">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span th:text="${passwordErrorMessage}">Lỗi</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label small fw-semibold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}" 
                                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label small fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" 
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''" 
                                       placeholder="Tối thiểu 6 ký tự" required>
                                <div class="invalid-feedback small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmNewPassword" class="form-label small fw-semibold">Nhập lại mật khẩu mới <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmNewPassword" th:field="*{confirmPassword}" 
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <button type="submit" class="btn btn-danger fw-semibold px-4">
                                <i class="bi bi-key me-1"></i>Xác nhận đổi mật khẩu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
