<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Navbar dành riêng cho khu vực Admin -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" th:fragment="adminNav(activePage)">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/admin/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>ADMIN DASHBOARD
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'"
                       th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Tổng quan
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'users'} ? 'active'"
                       th:href="@{/admin/users}">
                        <i class="bi bi-people me-1"></i>Khách hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'products'} ? 'active'"
                       th:href="@{/admin/products}">
                        <i class="bi bi-box-seam me-1"></i>Kho hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'categories'} ? 'active'"
                       th:href="@{/admin/categories}">
                        <i class="bi bi-tags me-1"></i>Danh mục
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'orders'} ? 'active'"
                       th:href="@{/admin/orders}">
                        <i class="bi bi-receipt me-1"></i>Đơn hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'reviews'} ? 'active'"
                       th:href="@{/admin/reviews}">
                        <i class="bi bi-star me-1"></i>Đánh giá
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-shop me-1"></i>Xem trang bán hàng
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/profile}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-person-circle me-1"></i>Hồ sơ
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
