<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Navbar chung cho các trang phía khách hàng -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" th:fragment="customerNav(activePage)">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bag-heart-fill me-2"></i>CLOTHING STORE
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#customerNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="customerNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'home'} ? 'active'" th:href="@{/}">
                        <i class="bi bi-house me-1"></i>Trang chủ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'shop'} ? 'active'" th:href="@{/shop}">
                        <i class="bi bi-shop me-1"></i>Cửa hàng
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${activePage == 'cart'} ? 'active'" th:href="@{/cart}">
                        <i class="bi bi-cart3 me-1"></i>Giỏ hàng
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${activePage == 'orders'} ? 'active'" th:href="@{/my-orders}">
                        <i class="bi bi-receipt me-1"></i>Đơn mua
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/admin/dashboard}">
                        <i class="bi bi-shield-lock me-1"></i>Admin Dashboard
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                    <a th:href="@{/register}" class="btn btn-light btn-sm fw-semibold">
                        <i class="bi bi-person-plus me-1"></i>Đăng ký
                    </a>
                </div>
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/profile}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Tài khoản</span>
                    </a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
