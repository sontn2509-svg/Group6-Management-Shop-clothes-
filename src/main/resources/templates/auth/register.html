<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản - Clothing Store</title>
    <!-- Nhúng thuần Bootstrap 5 & Bootstrap Icons qua CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card border-0 shadow rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">ĐĂNG KÝ TÀI KHOẢN</h3>
                    <p class="text-secondary small mb-0">Tạo tài khoản để trải nghiệm mua sắm tại Group 6 Clothing Store</p>
                </div>

                <!-- Thông báo lỗi chung (Ví dụ: Email đã tồn tại ERR-01, Mật khẩu không khớp ERR-02) -->
                <div class="alert alert-danger alert-dismissible fade show small" role="alert" th:if="${errorMessage}">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form đăng ký -->
                <form th:action="@{/register}" th:object="${registerDto}" method="post">
                    <!-- Họ và tên -->
                    <div class="mb-3">
                        <label for="fullName" class="form-label small fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" 
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" 
                                   placeholder="Nguyễn Văn A" required>
                            <div class="invalid-feedback small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" th:field="*{email}" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" 
                                   placeholder="name@example.com" required>
                            <div class="invalid-feedback small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="mb-3">
                        <label for="phone" class="form-label small fw-semibold">Số điện thoại</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="tel" class="form-control" id="phone" th:field="*{phone}" 
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" 
                                   placeholder="0912345678">
                            <div class="invalid-feedback small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <!-- Mật khẩu -->
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" th:field="*{password}" 
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" 
                                   placeholder="Tối thiểu 6 ký tự" required>
                            <div class="invalid-feedback small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <!-- Xác nhận mật khẩu -->
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label small fw-semibold">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group has-validation">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" 
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" 
                                   placeholder="Nhập lại mật khẩu" required>
                            <div class="invalid-feedback small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold shadow-sm">Đăng ký tài khoản</button>

                    <div class="text-center mt-4">
                        <p class="small text-secondary mb-0">
                            Đã có tài khoản? 
                            <a th:href="@{/login}" class="text-decoration-none fw-bold text-dark">Đăng nhập ngay</a>
                        </p>
                        <p class="small mt-2 mb-0">
                            <a th:href="@{/}" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> Về trang chủ</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
