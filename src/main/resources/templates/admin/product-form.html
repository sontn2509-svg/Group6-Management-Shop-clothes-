<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit != null and isEdit} ? 'Chỉnh sửa sản phẩm - Admin' : 'Thêm mẫu quần áo mới - Admin'">Thêm sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar Admin -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/admin/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>ADMIN DASHBOARD
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Tổng quan</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i>Khách hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/products}"><i class="bi bi-box-seam me-1"></i>Kho hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/categories}"><i class="bi bi-tags me-1"></i>Danh mục</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/orders}"><i class="bi bi-receipt me-1"></i>Đơn hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/reviews}"><i class="bi bi-star me-1"></i>Đánh giá</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <a th:href="@{/admin/products}" class="text-secondary text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách kho
                    </a>
                    <h4 class="fw-bold text-dark mt-1"
                        th:text="${isEdit != null and isEdit} ? 'Chỉnh sửa thông tin quần áo (FR08)' : 'Thêm mẫu quần áo mới (FR07)'">
                        Thêm mẫu quần áo mới
                    </h4>
                </div>
            </div>

            <!-- Alert lỗi nếu có -->
            <div class="alert alert-danger alert-dismissible fade show small" role="alert" th:if="${errorMessage}">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <form th:action="${isEdit != null and isEdit} ? @{/admin/products/edit/{id}(id=${productFormDto.productId})} : @{/admin/products/add}"
                      th:object="${productFormDto}" method="post">

                    <div class="row g-3">
                        <!-- Tên sản phẩm -->
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Tên mẫu quần áo <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{productName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('productName')} ? 'is-invalid'"
                                   placeholder="Ví dụ: Áo Thun Cổ Tròn Cotton 100%">
                            <div class="invalid-feedback" th:errors="*{productName}"></div>
                        </div>

                        <!-- Danh mục -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                            <select th:field="*{categoryId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                        </div>

                        <!-- Giá bán -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="1000" min="1" th:field="*{price}" class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                   placeholder="Ví dụ: 199000">
                            <div class="invalid-feedback" th:errors="*{price}"></div>
                        </div>

                        <!-- Số lượng tồn kho -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Số lượng tồn kho <span class="text-danger">*</span></label>
                            <input type="number" min="0" th:field="*{stockQuantity}" class="form-control"
                                   th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'"
                                   placeholder="Ví dụ: 50">
                            <div class="invalid-feedback" th:errors="*{stockQuantity}"></div>
                        </div>

                        <!-- Giới tính -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Phân loại giới tính <span class="text-danger">*</span></label>
                            <select th:field="*{gender}" class="form-select">
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>

                        <!-- Màu sắc -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Màu sắc <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{color}" class="form-control"
                                   th:classappend="${#fields.hasErrors('color')} ? 'is-invalid'"
                                   placeholder="Ví dụ: Đen, Trắng, Xanh Navy...">
                            <div class="invalid-feedback" th:errors="*{color}"></div>
                        </div>

                        <!-- Chất liệu -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Chất liệu vải</label>
                            <input type="text" th:field="*{material}" class="form-control"
                                   placeholder="Ví dụ: Cotton 100%, Denim, Lụa, Nỉ...">
                        </div>

                        <!-- Kích cỡ hỗ trợ -->
                        <div class="col-12">
                            <label class="form-label fw-semibold d-block">Các size hỗ trợ:</label>
                            <div class="d-flex gap-4">
                                <div class="form-check" th:each="s : ${allSizes}">
                                    <input class="form-check-input" type="checkbox" name="sizes" th:value="${s}"
                                           th:id="'size_' + ${s}"
                                           th:checked="${productFormDto.sizes != null and productFormDto.sizes.contains(s)}">
                                    <label class="form-check-label fw-bold" th:for="'size_' + ${s}" th:text="${s}"></label>
                                </div>
                            </div>
                        </div>

                        <!-- Link ảnh sản phẩm -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">Đường dẫn hình ảnh (URL)</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control"
                                   placeholder="https://example.com/images/ao-thun.jpg">
                        </div>

                        <!-- Mô tả chi tiết -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả sản phẩm</label>
                            <textarea th:field="*{description}" class="form-control" rows="4"
                                      placeholder="Mô tả kiểu dáng, form áo, cách bảo quản và đặc điểm nổi bật..."></textarea>
                        </div>

                        <!-- Trạng thái nếu chỉnh sửa -->
                        <div class="col-md-6" th:if="${isEdit != null and isEdit}">
                            <label class="form-label fw-semibold">Trạng thái kinh doanh</label>
                            <select th:field="*{status}" class="form-select">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>

                        <!-- Nút bấm -->
                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-success px-4 fw-semibold">
                                <i class="bi bi-floppy me-1"></i>Lưu thông tin
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
