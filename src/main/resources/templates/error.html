<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đã có lỗi xảy ra - Group 6 Clothing Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow rounded-4 p-4 p-md-5 bg-white text-center">
                <div class="mb-3">
                    <i class="bi bi-exclamation-triangle text-warning display-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Đã có lỗi xảy ra</h3>
                <p class="text-secondary mb-1">
                    Mã lỗi: <span class="fw-semibold" th:text="${status != null ? status : '500'}">500</span>
                </p>
                <p class="text-secondary small mb-4" th:text="${error != null ? error : 'Lỗi hệ thống'}">Lỗi hệ thống</p>
                <p class="text-muted small mb-4" th:if="${message}" th:text="${message}"></p>

                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-dark px-4 shadow-sm fw-semibold">
                        <i class="bi bi-house me-1"></i>Về trang chủ
                    </a>
                    <a th:href="@{/shop}" class="btn btn-outline-dark px-4 shadow-sm">
                        <i class="bi bi-shop me-1"></i>Cửa hàng
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
