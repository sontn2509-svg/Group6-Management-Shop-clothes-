<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sản phẩm - Clothing Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/shop.css}">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bag-heart-fill me-2"></i>CLOTHING STORE
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navBar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/shop}"><i class="bi bi-shop me-1"></i>Cửa hàng</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>Giỏ hàng</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/my-orders}"><i class="bi bi-receipt me-1"></i>Đơn mua</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/admin/dashboard}">
                        <i class="bi bi-shield-lock me-1"></i>Admin Dashboard
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn btn-light btn-sm fw-semibold">Đăng ký</a>
                </div>
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/profile}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">Tài khoản</span>
                    </a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <div><h1 class="h2 fw-bold">Tất cả sản phẩm</h1>
            <p class="text-muted" th:text="|Tìm thấy ${products.totalElements} sản phẩm|">Danh sách sản phẩm</p>

        </div>
        <a th:href="@{/}"
           class="btn btn-outline-dark rounded-2 px-4 py-2">
            ← Trang chủ
        </a>


    </div>
    <div class="row g-4">
        <aside class="col-lg-3">
            <form class="card border-0 shadow-sm p-3" method="get" th:action="@{/shop}"><h2 class="h5 mb-3">Tìm kiếm &
                bộ lọc</h2>
                <label class="form-label">Tên sản phẩm</label><input class="form-control mb-3" name="keyword"
                                                                     th:value="${keyword}"
                                                                     placeholder="Nhập tên quần áo">
                <label class="form-label">Danh mục</label><select class="form-select mb-3" name="categoryId">
                    <option value="">Tất cả</option>
                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"
                            th:selected="${categoryId != null and categoryId == c.categoryId}"></option>
                </select>
                <label class="form-label">Giới tính</label><select class="form-select mb-3" name="gender">
                    <option value="">Tất cả</option>
                    <option value="MEN" th:selected="${gender == 'MEN'}">Nam</option>
                    <option value="WOMEN" th:selected="${gender == 'WOMEN'}">Nữ</option>
                    <option value="UNISEX" th:selected="${gender == 'UNISEX'}">Unisex</option>
                </select>
                <label class="form-label">Kích cỡ</label><select class="form-select mb-3" name="size">
                    <option value="">Tất cả</option>
                    <option th:each="s : ${ {'S','M','L','XL'} }" th:value="${s}" th:text="${s}"
                            th:selected="${size == s}"></option>
                </select>
                <label class="form-label">Giá từ (VNĐ)</label><input class="form-control mb-2" type="number" min="0"
                                                                     step="1000" name="minPrice" th:value="${minPrice}">
                <label class="form-label">Đến (VNĐ)</label><input class="form-control mb-3" type="number" min="0"
                                                                  step="1000" name="maxPrice" th:value="${maxPrice}">
                <button class="btn btn-store w-100">Áp dụng</button>
                <a class="btn btn-link text-dark" th:href="@{/shop}">Xóa bộ lọc</a></form>
        </aside>
        <section class="col-lg-9">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3">
                <div class="col" th:each="p : ${products.content}"><a class="text-decoration-none text-dark"
                                                                      th:href="@{/shop/products/{id}(id=${p.productId})}">
                    <div class="product-card"><img class="product-picture"
                                                   th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                                                   th:src="${p.imageUrl}" alt="Ảnh sản phẩm">
                        <div th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                             class="product-placeholder">◈
                        </div>
                        <div class="p-3">
                            <div class="fw-semibold" th:text="${p.productName}">Tên sản phẩm</div>
                            <div class="small text-muted" th:text="${p.color}">Màu sắc</div>
                            <div class="product-price mt-2"
                                 th:text="|${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} đ|">0 đ
                            </div>
                        </div>
                    </div>
                </a></div>
            </div>
            <div class="text-center py-5" th:if="${products.empty}">Chưa có sản phẩm phù hợp. Hãy thử bỏ bớt bộ lọc.
            </div>
            <nav class="mt-4" aria-label="Phân trang" th:if="${products.totalPages > 1}">
                <ul class="pagination justify-content-center flex-wrap">
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'"><a class="page-link"
                                                                                             th:href="@{/shop(keyword=${keyword},categoryId=${categoryId},gender=${gender},size=${size},minPrice=${minPrice},maxPrice=${maxPrice},page=${products.number - 1})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'"><a class="page-link" th:text="${i+1}"
                                                                               th:href="@{/shop(keyword=${keyword},categoryId=${categoryId},gender=${gender},size=${size},minPrice=${minPrice},maxPrice=${maxPrice},page=${i})}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'"><a class="page-link"
                                                                                            th:href="@{/shop(keyword=${keyword},categoryId=${categoryId},gender=${gender},size=${size},minPrice=${minPrice},maxPrice=${maxPrice},page=${products.number + 1})}">Tiếp</a>
                    </li>
                </ul>
            </nav>
        </section>
    </div>
</main>
</body>
</html>
